[package]
name = "creme-brulee"
authors = ["h4rl <contact@h4rl.dev>"]
version = "0.1.0"
edition = "2024"

[dependencies]
openssl = "0.10.72"
rustls-pemfile = "2.2.0"
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "env-filter", "ansi"] }
rustls = { version = "0.23.25", default-features = false, features = ["ring"] }
mime_guess = "2.0.5"
serde = { version = "1.0.219", features = ["derive", "serde_derive"] }
toml = "0.8.22"
axum = { version = "0.8.4", features = ["http2", "macros"] }
tokio = { version = "1.45.1", features = ["full"] }
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
axum-extra = { version = "0.10.1", features = ["cookie-private", "cookie-signed"] }
tower-http = { version = "0.6.6", features = ["compression-full", "decompression-full", "fs"] }
tower = "0.5.2"
clap = { version = "4.5.40", features=["derive"] }
once_cell = "1.21.3"
humantime = "2.2.0"
jsonwebtoken = "9.2.0"
argon2 = "0.5.3"
cookie = { version = "0.18", features = ["secure", "percent-encode"] }
tower-cookies = "0.10.0"
uuid = { version = "1.6.1", features = ["v4", "serde"] }
chrono = { version = "0.4.35", features = ["serde"] }
time = { version = "0.3.34", features = ["serde", "formatting", "parsing"] }
validator = { version = "0.16.1", features = ["derive"] }
rand = "0.8.5"
dotenvy = "0.15.0"
anyhow = "1.0.80"
thiserror = "1.0.57"
async-trait = "0.1.88"
sea-orm = { version = "1.1.14", features = ["sqlx-sqlite", "runtime-tokio", "macros", "with-chrono", "with-uuid", "with-time"] }
sea-orm-migration = "1.1.14"
